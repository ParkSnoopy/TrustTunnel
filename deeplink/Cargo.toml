[package]
name = "trusttunnel-deeplink"
version.workspace = true
edition.workspace = true
authors = ["AdGuard"]
description = "Deep-link URI encoding and decoding for TrustTunnel configurations"
repository.workspace = true
license.workspace = true
keywords = ["vpn", "deeplink", "trusttunnel"]
categories = ["encoding", "network-programming"]

[dependencies]
base64 = "0.21"
thiserror = "1.0"
rustls-pemfile = "1.0"
hex = "0.4"

[features]
default = []
serde = ["dep:serde"]

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dev-dependencies]
proptest = "1.0"
rand = "0.10.0"

[lints]
workspace = true
